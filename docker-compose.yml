# Local development stack: Postgres + migrations + FastAPI with hot reload.
#
#   docker compose up --build     start everything (migrations run automatically)
#   docker compose down           stop, keep the database
#   docker compose down -v        stop and WIPE the database volume
#
# This stack never touches production. The migrate service talks to `db` by
# hostname, and the backend's DATABASE_URL is overridden below — so even though
# backend/.env holds the Railway connection string, nothing here can reach it.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: leetcode_review
    ports:
      # Exposed so you can connect from the host:
      #   psql postgresql://postgres:postgres@localhost:5433/leetcode_review
      # Port 5433 avoids clashing with a Postgres you may already run locally.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leetcode_review"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: applies any migration not yet in the schema_migrations ledger,
  # then exits 0. Runs on every `up`, so adding a new migration file is all it
  # takes — no volume wipe needed. See backend/db/migrate.sh.
  migrate:
    image: postgres:16
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: leetcode_review
      DB_DIR: /db
    volumes:
      - ./backend/db:/db:ro
    entrypoint: ["bash", "/db/migrate.sh"]
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.local
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Overrides whatever DATABASE_URL is in backend/.env. `environment` wins
      # over `env_file` in Compose — this is the guard that keeps local runs off
      # the production database.
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/leetcode_review
    volumes:
      # Bind-mount the source so --reload picks up edits without a rebuild.
      - ./backend:/app
      # Anonymous volumes masking host-only dirs, so they don't leak into the
      # container over the bind mount above.
      - /app/.venv
      - /app/__pycache__
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pgdata:
